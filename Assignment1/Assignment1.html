<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Mathieu's Art Gallery</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            text-align: center;
        }
 .art {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
    .artwork {
            width: 33%;
            text-align: center;
        }
        .artwork img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            cursor: pointer;
        }
        #popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            text-align: center;
        }
       #popup img {
            max-width: 90%;
            max-height: 80%;
            margin-top: 30px;
        }
        #caption {
            color: white;
            font-size: 16px;
            margin: 20px;
        }

    </style>

</head>


<body>

    <h1>Mathieu's Art Gallery</h1>
<body style="background-color: rgb(85, 40, 99);"></body>

    <div class="art">

    <div class="artwork">

            <img
                src="Images/genesect thumbnail.png"
                onclick="showImage(
                    'Images/genesect.png',
                    'Here is an image I made to challenge myself in 2025. I wanted to see how much I could improve my ability to color and render my images, while also using it as a stepping stone for printing my work physically!'
                )"
            >

            <h2>genesect</h2>

        </div>
        <div class="artwork">

            <img
                src="Images/ergo sum thumbnail.png"
                onclick="showImage(
                    'Images/ergo sum.png',
                    'I made this image in 2024 to celebrate and commemorate the completion of Destiny 2s Final Shape expansion. I felt particularly connected with the world of this game, and wanted to express my love for the game through my artwork.'
                )"
            >

            <h2>ergo sum</h2>

        </div>
        <div class="artwork">

            <img
                src="Images/blue-eyes thumbnail.png"
                onclick="showImage(
                    'Images/blue-eyes.png',
                    'I made this image in 2025 to challenge myself. I chose a screenshot from Yugiohs anime, and decided to try redrawing it in my own style. I believe I was able to make it look much more interesting!'
                )"
            >

            <h2>blue-eyes</h2>

        </div>

    </div>
    <div id="popup" onclick="closeImage()">

        <img id="bigImage">

        <p id="caption"></p>

    </div>

   <script>

        function showImage(image, caption) {

            document.getElementById("popup").style.display = "block";

            document.getElementById("bigImage").src = image;

            document.getElementById("caption").innerHTML = caption;

        }


        function closeImage() {

            document.getElementById("popup").style.display = "none";

        }

    </script>


</body>

</html>
